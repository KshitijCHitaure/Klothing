<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Klothing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo-container">
            <img src="logo.png" class="logo">
            <h2>Klothing</h2>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html" class="active">Cart</a></li>
        </ul>
    </nav>
</header>

<section class="cart-page">
    <h1>Your Cart</h1>

    <div id="cartItems"></div>

    <div class="cart-summary">
        <h2>Total: ₹<span id="cartTotal">0</span></h2>
    </div>

    <form id="checkoutForm">

        <input type="text" id="customerName" placeholder="Full Name" required>

        <input type="tel" id="customerPhone" placeholder="Phone Number" required>

        <textarea id="customerAddress" placeholder="Delivery Address" required></textarea>

        <button type="submit" class="btn">
            Order Via WhatsApp
        </button>

    </form>
</section>

<script src="script.js"></script>
</body>
</html>
